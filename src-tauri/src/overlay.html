<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body,#root{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#root{position:relative;transform-origin:0 0}.el{position:absolute;display:flex;align-items:center;justify-content:center;overflow:hidden;line-height:1.08}.text{justify-content:flex-start;font-family:Segoe UI,sans-serif;font-weight:700}.el img,.el video{width:100%;height:100%;object-fit:cover}.widget{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:24px;padding:20px}.badge{color:#46d9e9;font-size:.35em;letter-spacing:.2em}.custom{border:0;width:100%;height:100%;background:transparent}.fade{animation:fade .7s}.slide{animation:slide .6s}.pulse{animation:pulse 1.8s infinite}@keyframes fade{from{opacity:0}}@keyframes slide{from{margin-left:-35px}}@keyframes pulse{50%{filter:brightness(1.35)}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');let revision=-1;
function safeUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function render(scene){if(!scene||scene.revision===revision)return;revision=scene.revision;root.innerHTML='';root.style.width=(scene.width||1920)+'px';root.style.height=(scene.height||1080)+'px';root.style.background=scene.background||'transparent';
for(const item of (scene.elements||[]).filter(x=>x.visible).sort((a,b)=>a.zIndex-b.zIndex)){const el=document.createElement('div');el.className='el '+item.kind+' '+(item.animation||'');Object.assign(el.style,{left:item.x+'px',top:item.y+'px',width:item.width+'px',height:item.height+'px',transform:'rotate('+item.rotation+'deg)',opacity:item.opacity,color:item.color,background:item.background,fontSize:item.fontSize+'px',borderRadius:item.borderRadius+'px',zIndex:item.zIndex});
if(item.kind==='image'){const url=safeUrl(item.content);if(url){const img=document.createElement('img');img.src=url;el.append(img)}}else if(item.kind==='video'){const url=safeUrl(item.content);if(url){const video=document.createElement('video');video.src=url;video.autoplay=true;video.loop=true;video.muted=true;video.playsInline=true;el.append(video)}}else if(item.kind==='custom'){const frame=document.createElement('iframe');frame.className='custom';frame.sandbox='allow-scripts';frame.srcdoc=item.content;el.append(frame)}else if(['alert','poll'].includes(item.kind)){const box=document.createElement('div');box.className='widget';const copy=document.createElement('div');const badge=document.createElement('div');badge.className='badge';badge.textContent=item.kind==='alert'?'ALERTA':'ENCUESTA';const value=document.createElement('strong');value.textContent=item.content;copy.append(badge,value);box.append(copy);el.append(box)}else{el.textContent=item.content}root.append(el)}}
async function update(){try{const r=await fetch('/api/live',{cache:'no-store'});render(await r.json())}catch{}}setInterval(update,500);update();
</script></body></html>
