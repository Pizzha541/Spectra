<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body,#player{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}iframe,video{width:100%;height:100%;border:0;object-fit:contain;background:transparent}</style></head><body><div id="player"></div><script>
const host=document.getElementById('player');let current='';
function safe(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)?u:null}catch{return null}}
function embed(value){const u=safe(value);if(!u)return null;const h=u.hostname.toLowerCase();if(h==='youtu.be'||h.includes('youtube.com')){let id=h==='youtu.be'?u.pathname.slice(1):u.searchParams.get('v');if(!id&&u.pathname.startsWith('/shorts/'))id=u.pathname.split('/')[2];return id?'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?autoplay=1&enablejsapi=1':null}if(h.includes('twitch.tv')){const p=u.pathname.split('/').filter(Boolean);return p[0]==='videos'&&p[1]?'https://player.twitch.tv/?video='+encodeURIComponent(p[1])+'&parent=127.0.0.1&autoplay=true':p[0]?'https://player.twitch.tv/?channel='+encodeURIComponent(p[0])+'&parent=127.0.0.1&autoplay=true':null}return u.href}
function render(state){const media=state.media;if(!media||media.status==='paused'){host.innerHTML='';current='';return}const existing=host.querySelector('video');if(existing)existing.volume=Math.max(0,Math.min(1,state.volume??.7));if(media.id===current)return;current=media.id;host.innerHTML='';const url=embed(media.url);if(!url)return;if(media.platform==='direct'){const video=document.createElement('video');video.src=url;video.autoplay=true;video.controls=false;video.volume=Math.max(0,Math.min(1,state.volume??.7));host.append(video)}else{const frame=document.createElement('iframe');frame.src=url;frame.allow='autoplay; encrypted-media; fullscreen';frame.referrerPolicy='strict-origin-when-cross-origin';host.append(frame)}}
async function update(){try{const r=await fetch('/api/media',{cache:'no-store'});render(await r.json())}catch{}}setInterval(update,500);update();
</script></body></html>
